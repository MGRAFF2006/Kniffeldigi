name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: boat-small
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test rules
        run: node tests/rules.test.mjs
      - name: Test log snapshots
        run: node --test tests/log-snapshots.test.mjs
      - name: Test API
        run: |
          npm run dev > /tmp/wuerfelblock-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8788/ >/dev/null && break
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/wuerfelblock-dev.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8788/ >/dev/null
          node tests/api.test.mjs
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: npx playwright install --with-deps --only-shell chromium
      - name: Test browser journey
        # Der Test startet und beendet seinen eigenen wrangler-dev-Server.
        timeout-minutes: 3
        run: npm run test:browser
