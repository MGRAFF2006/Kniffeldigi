name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: boat-small
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test rules
        run: node tests/rules.test.mjs
      - name: Test log snapshots
        run: node --test tests/log-snapshots.test.mjs
      - name: Test game persistence
        run: node tests/game.test.mjs
      - name: Test API
        run: npm run test:api
      - name: Validate Worker bundle
        run: npm run check:deploy
